name: Build slides

on:
  push:
    branches: [main]
    paths: ["slides/**", ".github/workflows/slides.yml"]
  pull_request:
    paths: ["slides/**", ".github/workflows/slides.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - run: npm ci

      # type-check (tsc --noEmit) and production build into slides/dist
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: slides-dist
          path: slides/dist
          retention-days: 14
